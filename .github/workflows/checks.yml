name: Chappi Edition checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chappi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chappi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chappi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check

      - name: Start server and run end-to-end smoke test
        env:
          PORT: 8080
          INITIAL_ADMIN_USERNAME: admin
          INITIAL_ADMIN_PASSWORD: SmokeTestAdminPassword123
          JWT_SECRET: ci-only-secret-that-is-long-and-random-enough
        run: |
          npm start > /tmp/chappi-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/api/health; then
              break
            fi
            sleep 1
          done
          if ! curl --silent --fail http://127.0.0.1:8080/api/health; then
            cat /tmp/chappi-server.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:8080 INITIAL_ADMIN_USERNAME=admin INITIAL_ADMIN_PASSWORD=SmokeTestAdminPassword123 node tests/smoke.js
          kill $SERVER_PID
